name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar ambiente
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Compilar APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validar APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Treino_Diario_Android_v1.2.apk
          sha256sum Treino_Diario_Android_v1.2.apk | tee SHA256.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Diario-Android-v1.2
          path: |
            Treino_Diario_Android_v1.2.apk
            SHA256.txt
          if-no-files-found: error
          retention-days: 30
